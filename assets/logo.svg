<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180">
  <defs>
    <radialGradient id="hBadgeBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <linearGradient id="hBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="hBadgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06d6a0" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hRibbonFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="hRibbonBack" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#091124"/>
    </linearGradient>

    <radialGradient id="hCatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hNodeGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <radialGradient id="hNodeCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
    </radialGradient>

    <filter id="hBadgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left: The Master Emblem (144x144, scaled from 512x512) -->
  <g transform="translate(18, 18)" filter="url(#hBadgeGlow)">
    <rect width="144" height="144" rx="32" fill="url(#hBadgeBg)" stroke="url(#hBadgeBorder)" stroke-width="1.8"/>

    <!-- Coordinate Ring -->
    <circle cx="72" cy="72" r="50" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.2"/>
    <circle cx="72" cy="72" r="30" fill="none" stroke="#60a5fa" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.25"/>

    <!-- Contact vectors -->
    <g stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="2 2" opacity="0.45">
      <line x1="45" y1="43" x2="72" y2="72"/>
      <line x1="99" y1="42" x2="72" y2="72"/>
      <line x1="42" y1="101" x2="72" y2="72"/>
      <line x1="101" y1="101" x2="72" y2="72"/>
    </g>

    <!-- Under-fold Shading -->
    <path d="M 97 45 C 110 60, 103 76, 82 82 L 78 75 C 93 70, 98 58, 89 45 Z" fill="url(#hRibbonBack)" opacity="0.9"/>
    <path d="M 47 99 C 34 84, 41 67, 62 62 L 66 69 C 51 74, 46 86, 55 99 Z" fill="url(#hRibbonBack)" opacity="0.9"/>

    <!-- Front S-Ribbon -->
    <path d="M 101 39
             C 75 37, 52 52, 58 75
             C 62 87, 73 93, 86 97
             C 103 101, 109 114, 103 123
             C 95 135, 70 135, 51 123
             L 47 131
             C 69 146, 105 144, 114 125
             C 122 108, 112 92, 93 87
             C 79 83, 70 78, 67 70
             C 63 55, 82 44, 105 45 Z"
          fill="url(#hRibbonFront)"/>

    <!-- Beta-Strand Arrow -->
    <path d="M 54 118 L 40 127 L 51 135 Z" fill="#06d6a0"/>

    <!-- Specular highlight -->
    <path d="M 82 40 C 63 41, 48 50, 51 67 C 54 81, 70 89, 84 92 C 106 99, 115 114, 108 127 C 103 138, 75 141, 52 129"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

    <!-- Active Site Catalytic Core -->
    <circle cx="72" cy="72" r="17" fill="url(#hCatGlow)"/>
    <circle cx="72" cy="72" r="5" fill="url(#hNodeGold)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="70.5" cy="70.5" r="1.3" fill="#ffffff"/>

    <!-- Nodes -->
    <circle cx="50" cy="54" r="3" fill="url(#hNodeCyan)" stroke="#bae6fd" stroke-width="0.8"/>
    <circle cx="99" cy="43" r="2.8" fill="#818cf8" stroke="#c7d2fe" stroke-width="0.8"/>
    <circle cx="62" cy="72" r="2.6" fill="#06d6a0" stroke="#a7f3d0" stroke-width="0.8"/>
    <circle cx="88" cy="88" r="2.8" fill="url(#hNodeGold)" stroke="#fef08a" stroke-width="0.8"/>
    <circle cx="105" cy="112" r="3" fill="url(#hNodeCyan)" stroke="#bae6fd" stroke-width="0.8"/>
    <circle cx="75" cy="133" r="2.6" fill="#06d6a0" stroke="#a7f3d0" stroke-width="0.8"/>
  </g>

  <!-- Right: Authoritative Brand Typography -->
  <g transform="translate(188, 0)">
    <!-- Scientist / Organization Identity -->
    <text x="0" y="55" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      SULEIMAN
    </text>

    <!-- Discipline & Laboratory Portal -->
    <text x="0" y="94" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#hBrandGrad)" letter-spacing="-0.3">
      Computational Structural Biology
    </text>

    <!-- Scientific Competency Badges -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: AlphaFold2 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0e172e" stroke="#1e293b" stroke-width="1"/>
      <text x="65" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
        ALPHAFOLD2
      </text>

      <!-- Pill 2: Kinase Mechanics -->
      <rect x="140" y="0" width="156" height="26" rx="6" fill="#0e172e" stroke="#1e293b" stroke-width="1"/>
      <text x="218" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="0.5">
        KINASE MECHANICS
      </text>

      <!-- Pill 3: Molecular Docking -->
      <rect x="306" y="0" width="168" height="26" rx="6" fill="#0e172e" stroke="#1e293b" stroke-width="1"/>
      <text x="390" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#06d6a0" text-anchor="middle" letter-spacing="0.5">
        MOLECULAR DOCKING
      </text>

      <!-- Pill 4: Network Biology -->
      <rect x="484" y="0" width="156" height="26" rx="6" fill="#0e172e" stroke="#1e293b" stroke-width="1"/>
      <text x="562" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">
        NETWORK BIOLOGY
      </text>
    </g>
  </g>
</svg>