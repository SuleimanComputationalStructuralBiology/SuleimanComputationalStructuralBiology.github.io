<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee6c9"/>
      <stop offset="50%" stop-color="#0a7ea4"/>
      <stop offset="100%" stop-color="#8b7bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070b17"/>
  <!-- stylized alpha-helix / kinase active-cleft node graph -->
  <g stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- helix ribbons -->
    <path d="M16 48 C 20 40, 24 38, 32 38 C 40 38, 44 40, 48 48"/>
    <path d="M16 36 C 20 28, 24 26, 32 26 C 40 26, 44 28, 48 36"/>
    <path d="M16 24 C 20 16, 24 14, 32 14 C 40 14, 44 16, 48 24"/>
    <!-- vertical backbone spine -->
    <path d="M32 10 L 32 54" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  </g>
  <!-- active site coordination triad nodes -->
  <circle cx="20" cy="24" r="3.2" fill="#2ee6c9"/>
  <circle cx="44" cy="24" r="3.2" fill="#8b7bff"/>
  <circle cx="32" cy="38" r="3.8" fill="#ffdb13"/>
  <circle cx="20" cy="48" r="2.8" fill="#65cbf3"/>
  <circle cx="44" cy="48" r="2.8" fill="#2ee6c9"/>
</svg>
