<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="favRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="favGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#favBg)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- High-Contrast Bold 3D S-Ribbon for 16-32px Favicon Clarity -->
  <path d="M 44 16
           C 32 15, 23 22, 26 32
           C 28 38, 33 41, 39 43
           C 46 45, 49 51, 46 55
           C 42 60, 31 60, 22 55
           L 20 58
           C 30 65, 47 64, 51 56
           C 55 49, 50 42, 42 40
           C 36 38, 32 35, 31 32
           C 29 25, 38 20, 48 21 Z"
        fill="url(#favRibbon)"/>

  <!-- Beta Arrow on Terminus -->
  <path d="M 24 53 L 17 58 L 22 62 Z" fill="#06d6a0"/>

  <!-- Catalytic Core Node in Center -->
  <circle cx="32" cy="32" r="3.5" fill="url(#favGold)" stroke="#fef08a" stroke-width="0.8"/>

  <!-- Key Coordinate Nodes -->
  <circle cx="23" cy="24" r="2.2" fill="#00f2fe"/>
  <circle cx="44" cy="20" r="2" fill="#818cf8"/>
  <circle cx="47" cy="50" r="2.2" fill="#00f2fe"/>
  <circle cx="33" cy="59" r="1.8" fill="#06d6a0"/>
</svg>